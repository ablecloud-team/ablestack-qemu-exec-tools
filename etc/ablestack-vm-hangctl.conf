# ABLESTACK VM Hang Control - Config
#
# Installation target:
#   - ABLESTACK Host (Rocky Linux 9 based)
#
# Format:
#   - bash-style KEY=VALUE
#   - lines starting with # are comments
#
# NOTE:
#   This file is sourced by the tool. Keep it root-owned and writable only by admins.

# Policy name
HANGCTL_POLICY="default"

# Dry-run mode (1: log only, 0: normal)
HANGCTL_DRY_RUN="0"

# Probe timeouts (seconds)
HANGCTL_VIRSH_TIMEOUT_SEC="3"
HANGCTL_QMP_TIMEOUT_SEC="5"
HANGCTL_QGA_TIMEOUT_SEC="5"

# VM hang confirmation windows (seconds)
HANGCTL_CONFIRM_WINDOW_SEC="120"
HANGCTL_PAUSED_CONFIRM_WINDOW_SEC="300"
HANGCTL_MIGRATION_CONFIRM_WINDOW_SEC="3600"
HANGCTL_MIGRATION_PROGRESS_CHECK_SEC="300"

# Log rotation
HANGCTL_LOG_MAX_SIZE_MB="100"
HANGCTL_LOG_ROTATE_COUNT="5"

# Verify timeout for post-action domstate
HANGCTL_VERIFY_TIMEOUT_SEC="3"

# Kill escalation grace after SIGTERM before SIGKILL
HANGCTL_KILL_GRACE_SEC="2"

# Runtime directories
HANGCTL_RUN_DIR="/run/ablestack-vm-hangctl"
HANGCTL_LOG_DIR="/var/log/ablestack-vm-hangctl"
HANGCTL_LOCK_FILE="/run/ablestack-vm-hangctl/lock"
HANGCTL_STATE_DIR="/run/ablestack-vm-hangctl/state"
HANGCTL_EVENTS_LOG="/var/log/ablestack-vm-hangctl/events.log"

# Evidence collection before action
HANGCTL_EVIDENCE_ENABLE="1"
HANGCTL_EVIDENCE_DIR="/var/log/ablestack-vm-hangctl/evidence"
HANGCTL_EVIDENCE_DUMPXML="1"
HANGCTL_EVIDENCE_JOURNAL_SEC="180"
HANGCTL_EVIDENCE_TIMEOUT_SEC="3"

# Memory dump before action
# Dump files can be large. Ensure disk capacity before enabling in production.
HANGCTL_DUMP_ENABLE="1"
HANGCTL_DUMP_DIR="/var/lib/libvirt/dump"
HANGCTL_DUMP_TIMEOUT_SEC="60"
HANGCTL_DUMP_MIN_FREE_GB="10"
HANGCTL_DUMP_MAX_PER_SCAN="1"
HANGCTL_DUMP_SHA256="1"
HANGCTL_DUMP_STABLE_COUNT="3"
HANGCTL_DUMP_STABLE_INTERVAL_SEC="1"

# Storage guards
HANGCTL_STORAGE_GUARD_ENABLE="1"
HANGCTL_STORAGE_GUARD_TIMEOUT_SEC="5"
HANGCTL_NFS_GUARD_ENABLE="1"
HANGCTL_NFS_GUARD_TIMEOUT_SEC="5"
HANGCTL_NFS_GUARD_PORT="2049"

# Libvirtd health gate and recovery
# HA-safe default: detect and log libvirtd health failures, but do not restart
# host-wide libvirtd unless an operator explicitly enables it.
HANGCTL_LIBVIRTD_SERVICE="libvirtd.service"
HANGCTL_LIBVIRTD_RESTART_ENABLED="0"
HANGCTL_LIBVIRTD_HEALTH_TIMEOUT_SEC="10"
HANGCTL_LIBVIRTD_FAIL_THRESHOLD="5"
HANGCTL_LIBVIRTD_RESTART_COOLDOWN_SEC="1800"
HANGCTL_LIBVIRTD_RESTART_TIMEOUT_SEC="60"
HANGCTL_LIBVIRTD_POST_RESTART_WAIT_SEC="15"
HANGCTL_LIBVIRTD_RESTART_BACKOFF_SEC="3600"
HANGCTL_LIBVIRTD_RESTART_MAX_PER_HOUR="1"
HANGCTL_LIBVIRTD_RESTART_ON_API_TIMEOUT="0"
HANGCTL_LIBVIRTD_EXPECTED_SOCKET="/var/run/libvirt/libvirt-sock /run/libvirt/libvirt-sock /var/run/libvirt/virtqemud-sock /run/libvirt/virtqemud-sock"

# Pacemaker/HA cluster guard for libvirtd restart
HANGCTL_CLUSTER_GUARD_ENABLE="1"
HANGCTL_CLUSTER_GUARD_FAIL_CLOSED="1"
HANGCTL_CLUSTER_GUARD_SETTLE_SEC="600"
HANGCTL_CLUSTER_GUARD_TIMEOUT_SEC="5"
HANGCTL_CLUSTER_GUARD_RESOURCE_REGEX="cloudcenter_res"

# Target filters (optional; CLI overrides these)
# Prefer --vm for validation runs on production hosts.
HANGCTL_TARGET_VM=""
HANGCTL_INCLUDE_REGEX=""
HANGCTL_EXCLUDE_REGEX=""

# Examples:
# HANGCTL_TARGET_VM="i-2-1147-VM"
# HANGCTL_INCLUDE_REGEX="^i-"
# HANGCTL_EXCLUDE_REGEX="^(mgmt-|infra-)"
