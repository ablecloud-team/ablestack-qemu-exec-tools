name: FTCTL Branch Development Release

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or commit SHA to build for test deployment
        required: true
        default: feature/ftctl-cloud-integration
        type: string
      release_label:
        description: Optional release label. Defaults to a sanitized source_ref.
        required: false
        default: ''
        type: string
      draft:
        description: Create the GitHub Release as a draft
        required: false
        default: true
        type: boolean

concurrency:
  group: ftctl-branch-dev-release-${{ inputs.source_ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-ftctl-rpm:
    runs-on: ubuntu-latest
    container:
      image: rockylinux/rockylinux:9
      options: --user 0
    outputs:
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      release_name: ${{ steps.metadata.outputs.release_name }}
      source_commit_sha: ${{ steps.metadata.outputs.source_commit_sha }}
      version: ${{ steps.metadata.outputs.version }}
      release: ${{ steps.metadata.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - id: metadata
        shell: bash
        run: |
          set -euo pipefail

          ref_slug="${{ inputs.release_label }}"
          if [ -z "$ref_slug" ]; then
            ref_slug=$(printf '%s' "${{ inputs.source_ref }}" \
              | tr '[:upper:]' '[:lower:]' \
              | sed -E 's#[^a-z0-9._-]+#-#g; s#^-+##; s#-+$##')
          fi

          if [ -z "$ref_slug" ]; then
            echo "::error::Unable to derive release label"
            exit 1
          fi

          . ./VERSION
          source_commit_sha="${GITHUB_SHA}"
          release_tag="dev-branch-${ref_slug}-ftctl-latest"
          release_name="FTCTL Branch Dev ${ref_slug} Latest"

          {
            echo "release_tag=$release_tag"
            echo "release_name=$release_name"
            echo "source_commit_sha=$source_commit_sha"
            echo "version=$VERSION"
            echo "release=$RELEASE"
          } >> "$GITHUB_OUTPUT"

      - name: Install build deps
        shell: bash
        run: |
          set -euo pipefail
          cat > /etc/yum.repos.d/rocky-vault-9.6.repo <<'EOF'
          [rocky-vault-9.6-baseos]
          name=Rocky Linux 9.6 - BaseOS (vault)
          baseurl=https://dl.rockylinux.org/vault/rocky/9.6/BaseOS/$basearch/os/
          enabled=1
          gpgcheck=0

          [rocky-vault-9.6-appstream]
          name=Rocky Linux 9.6 - AppStream (vault)
          baseurl=https://dl.rockylinux.org/vault/rocky/9.6/AppStream/$basearch/os/
          enabled=1
          gpgcheck=0

          [rocky-vault-9.6-crb]
          name=Rocky Linux 9.6 - CRB (vault)
          baseurl=https://dl.rockylinux.org/vault/rocky/9.6/CRB/$basearch/os/
          enabled=1
          gpgcheck=0
          EOF
          dnf clean all
          dnf -y --disablerepo="*" --enablerepo="rocky-vault-9.6-*" makecache
          dnf -y --disablerepo="*" --enablerepo="rocky-vault-9.6-*" install \
            make rpm-build tar git jq dnf-plugins-core createrepo_c systemd-rpm-macros systemd

      - name: Build FTCTL RPM
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest tests.ftctl_dr_export_ownership_test
          python3 -m unittest tests.ftctl_dr_checkpoint_test tests.ftctl_dr_common_baseline_test tests.ftctl_dr_resume_state_test
          bash tests/ftctl_dr_ablestack_remote_rbd_smoke.sh
          bash tests/ftctl_dr_boot_hardware_smoke.sh
          bash tests/ftctl_dr_full_lifecycle_smoke.sh
          tests/ftctl_dr_release_tombstone_smoke.sh
          bash tests/ftctl_dr_status_terminal_fallback_smoke.sh
          bash tests/ftctl_dr_reprotect_authority_contract_smoke.sh
          bash tests/ftctl_dr_reprotect_terminal_smoke.sh
          bash tests/ftctl_dr_failover_final_checkpoint_smoke.sh
          bash tests/ftctl_dr_qcow2_cutover_quiesce_smoke.sh
          bash tests/ftctl_dr_guestprep_preflight_smoke.sh
          bash tests/ftctl_firewalld_no_reload_smoke.sh
          python3 -m unittest \
            tests.ftctl_qcow2_checkpoint_test \
            tests.ftctl_qcow2_bitmap_baseline_test \
            tests.ftctl_qcow2_bitmap_commit_test
          bash tests/ftctl_dr_worker_maintenance_smoke.sh
          bash tests/ftctl_dr_scheduler_nbd_recovery_smoke.sh
          bash tests/ftctl_dr_systemd_async_start_smoke.sh
          bash tests/ftctl_dr_ablestack_remote_rbd_smoke.sh
          bash tests/ftctl_dr_ablestack_qcow2_shared_smoke.sh
          bash tests/ftctl_dr_ablestack_offline_full_seed_smoke.sh
          bash tests/ftctl_dr_ablestack_seed_retry_smoke.sh
          bash tests/ftctl_dr_relocated_baseline_smoke.sh
          bash tests/ftctl_dr_active_cancel_recovery_smoke.sh
          bash tests/ftctl_dr_cancel_manual_recovery_smoke.sh
          bash tests/ftctl_dr_cancel_terminal_immutability_smoke.sh
          bash tests/ftctl_dr_fleet_admission_smoke.sh
          bash tests/ftctl_dr_rpo_deadline_smoke.sh
          bash tests/ftctl_dr_source_outage_recovery_smoke.sh
          bash tests/ftctl_dr_vmware_snapshot_cleanup_smoke.sh
          bash tests/ftctl_dr_vmware_thumbprint_refresh_smoke.sh
          python3 tests/ftctl_dr_bandwidth_limit_smoke.py
          python3 tests/ftctl_dr_rbd_extent_copy_smoke.py
          make ftctl-rpm

          rpm_path=$(find build/rpm-ftctl -type f -name 'ablestack_vm_ftctl-*.rpm' -print -quit)
          if [ -z "$rpm_path" ]; then
            echo "::error::FTCTL RPM was not produced"
            exit 1
          fi
          verify_root=$(mktemp -d)
          trap 'rm -rf "$verify_root"' EXIT
          (
            cd "$verify_root"
            rpm2cpio "$GITHUB_WORKSPACE/$rpm_path" | cpio -idm --quiet
          )
          for script in dr_export_ownership.py dr_ablestack.sh dr_runtime.sh dr_scheduler.sh qcow2_checkpoint.py qcow2_bitmap_baseline.py qcow2_bitmap_backup.py qcow2_bitmap_offline_backup.py qcow2_bitmap_commit.py; do
            packaged="$verify_root/usr/local/lib/ablestack-qemu-exec-tools/ftctl/$script"
            source="lib/ftctl/$script"
            expected_interpreter='#!/usr/bin/bash'
            case "$script" in
              *.py) expected_interpreter='#!/usr/bin/python3' ;;
            esac
            if [ "$(head -n 1 "$packaged")" != "$expected_interpreter" ]; then
              echo "::error::Packaged $script has an unexpected interpreter"
              head -n 1 "$packaged"
              exit 1
            fi
            if ! cmp -s <(tail -n +2 "$source") <(tail -n +2 "$packaged"); then
              echo "::error::Packaged $script body does not match the checked-out source"
              sha256sum "$source" "$packaged" || true
              exit 1
            fi
          done
          sha256sum \
            lib/ftctl/dr_runtime.sh \
            lib/ftctl/dr_scheduler.sh \
            lib/ftctl/qcow2_checkpoint.py \
            lib/ftctl/qcow2_bitmap_baseline.py \
            lib/ftctl/qcow2_bitmap_backup.py \
            lib/ftctl/qcow2_bitmap_offline_backup.py \
            lib/ftctl/qcow2_bitmap_commit.py \
            "$verify_root/usr/local/lib/ablestack-qemu-exec-tools/ftctl/dr_runtime.sh" \
            "$verify_root/usr/local/lib/ablestack-qemu-exec-tools/ftctl/dr_scheduler.sh" \
            "$verify_root/usr/local/lib/ablestack-qemu-exec-tools/ftctl/qcow2_checkpoint.py" \
            "$verify_root/usr/local/lib/ablestack-qemu-exec-tools/ftctl/qcow2_bitmap_baseline.py" \
            "$verify_root/usr/local/lib/ablestack-qemu-exec-tools/ftctl/qcow2_bitmap_backup.py" \
            "$verify_root/usr/local/lib/ablestack-qemu-exec-tools/ftctl/qcow2_bitmap_offline_backup.py" \
            "$verify_root/usr/local/lib/ablestack-qemu-exec-tools/ftctl/qcow2_bitmap_commit.py"

      - name: Create FTCTL RPM repo
        shell: bash
        run: |
          set -euo pipefail
          workdir="release/ftctl-rpm-rocky9.6"
          mkdir -p "$workdir"
          cp -v build/rpm-ftctl/*.rpm "$workdir"/
          dnf --disablerepo="*" --enablerepo="rocky-vault-9.6-*" download --resolve --alldeps \
            --destdir="$workdir" \
            bash jq openssh-clients python3 util-linux || true
          createrepo_c "$workdir"
          (
            cd release
            find ftctl-rpm-rocky9.6 -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          )
          cat > release/DEV-RELEASE.txt <<EOF
          Release tag: ${{ steps.metadata.outputs.release_tag }}
          Release name: ${{ steps.metadata.outputs.release_name }}
          Source ref: ${{ inputs.source_ref }}
          Source commit: ${{ steps.metadata.outputs.source_commit_sha }}
          Version: ${{ steps.metadata.outputs.version }}
          Release: ${{ steps.metadata.outputs.release }}
          GitHub run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF

      - name: Upload FTCTL RPM build outputs
        uses: actions/upload-artifact@v4
        with:
          name: ftctl-branch-rpm-${{ github.run_id }}
          if-no-files-found: error
          path: release/**

      - name: Publish FTCTL branch development release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.metadata.outputs.release_tag }}
          target_commitish: ${{ steps.metadata.outputs.source_commit_sha }}
          name: ${{ steps.metadata.outputs.release_name }}
          draft: ${{ inputs.draft }}
          prerelease: true
          generate_release_notes: false
          files: |
            release/DEV-RELEASE.txt
            release/SHA256SUMS
            release/ftctl-rpm-rocky9.6/*
