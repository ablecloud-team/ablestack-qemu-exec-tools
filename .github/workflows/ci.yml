name: CI Check

on:
  push:
    branches: ["main", "develop"]
  pull_request:

jobs:
  lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make

      - name: Run Make (all targets)
        run: |
          echo "Running CI build (basic validation)"
          make all

      - name: HANGCTL snapshot and action safety regression
        run: bash tests/hangctl_snapshot_protection_smoke.sh

      - name: FTCTL release tombstone regression gate
        run: |
          tests/ftctl_dr_release_tombstone_smoke.sh

      - name: FTCTL DR authority and VMware/RBD regression gates
        run: |
          bash tests/ftctl_dr_reprotect_authority_contract_smoke.sh
          bash tests/ftctl_dr_reprotect_terminal_smoke.sh
          bash tests/ftctl_dr_failover_final_checkpoint_smoke.sh
          bash tests/ftctl_dr_qcow2_cutover_quiesce_smoke.sh
          bash tests/ftctl_dr_guestprep_preflight_smoke.sh

      - name: FTCTL firewalld no-reload regression gate
        run: |
          bash tests/ftctl_firewalld_no_reload_smoke.sh

      - name: FTCTL scheduler NBD recovery smoke
        run: |
          bash tests/ftctl_dr_scheduler_nbd_recovery_smoke.sh
          bash tests/ftctl_dr_systemd_async_start_smoke.sh

      - name: FTCTL ABLESTACK remote RBD transport smoke
        run: |
          bash tests/ftctl_dr_ablestack_remote_rbd_smoke.sh

      - name: FTCTL ABLESTACK SharedMountPoint qcow2 transport smoke
        run: |
          python3 -m unittest tests.ftctl_qcow2_bitmap_baseline_test
          bash tests/ftctl_dr_ablestack_qcow2_shared_smoke.sh
          bash tests/ftctl_dr_ablestack_offline_full_seed_smoke.sh
          bash tests/ftctl_dr_ablestack_seed_retry_smoke.sh
          bash tests/ftctl_dr_relocated_baseline_smoke.sh

      - name: FTCTL DR cancel terminal immutability smoke
        run: |
          bash tests/ftctl_dr_cancel_terminal_immutability_smoke.sh

      - name: ISO package manager selection smoke
        run: |
          tests/iso_pkg_manager_selection_smoke.sh

      - name: V2K large CBT payload delivery smoke
        run: |
          python3 tests/v2k_patch_areas_file_smoke.py

      - name: V2K CBT pagination and controller selector smoke
        run: |
          python3 tests/v2k_cbt_pagination_smoke.py

      - name: V2K mixed-controller inventory smoke
        run: |
          tests/v2k_inventory_disk_order_smoke.sh

      - name: V2K mixed-controller CBT safety smoke
        run: |
          tests/v2k_controller_cbt_smoke.sh

      - name: V2K base transfer NFC retry smoke
        run: |
          tests/v2k_base_transfer_retry_smoke.sh

      - name: V2K manifest observability smoke
        run: |
          tests/v2k_manifest_observability_smoke.sh

      - name: V2K cutover bootstrap integrity smoke
        run: |
          tests/v2k_cutover_integrity_smoke.sh

      - name: V2K Ubuntu initramfs integrity smoke
        run: |
          tests/v2k_ubuntu_initramfs_smoke.sh

      - name: V2K WinPE asset integrity smoke
        run: |
          tests/v2k_winpe_asset_smoke.sh

      - name: N2K migration integrity smoke
        run: |
          tests/n2k_integrity_hardening_smoke.sh

      - name: N2K disk controller and identity integrity smoke
        run: |
          tests/n2k_controller_integrity_smoke.sh

      - name: N2K manifest observability smoke
        run: |
          tests/n2k_manifest_observability_smoke.sh

      - name: Release WinPE and MSI workflow smoke
        run: |
          python3 tests/release_winpe_wix_smoke.py
