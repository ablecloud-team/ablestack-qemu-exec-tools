name: WinPE Release Build

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: read

jobs:
  build:
    uses: ./.github/workflows/build-winpe-core.yml
    with:
      source_ref: ${{ github.sha }}
      architecture: "amd64"
      iso_base_name: "winpe-ablestack-v2k"
      iso_suffix: ${{ github.ref_name }}
      artifact_name: "winpe-iso-release"
      retention_days: 30

  release:
    needs: [build]
    uses: ./.github/workflows/build.yml
    with:
      source_ref: ${{ github.sha }}
      release_tag: ${{ github.ref_name }}
      publish_release: true
      use_prebuilt_winpe: true
      winpe_artifact_name: ${{ needs.build.outputs.artifact_name }}
